name: Generate Eagler 26.2 + ViaBackportVisuals

on:
  workflow_dispatch:
    inputs:
      patch_bundle_url:
        description: "Optional authorized source-patch-bundle.zip URL. Leave empty to use resources/source-patch-bundle.zip or the latest repo release asset."
        required: false
        type: string
        default: ""
      patch_bundle_sha256:
        description: "SHA-256 for patch_bundle_url. Required when patch_bundle_url is used."
        required: false
        type: string
        default: "df3af583c06aa22748d21f039980cdd3923dbcab0bc21accbbb28b1cd1e7389"

permissions:
  contents: write

concurrency:
  group: eagler-vbv-build
  cancel-in-progress: true

env:
  MC_SHA1: 2dc72797acbc1b63fc16a11c4ac393605f453754
  MC_SHA256: 40896ee9f1e2bec3c934daac7e93d41e9e3d9c2f8ae0ca366d52ffbfd1afa290
  VINEFLOWER_SHA256: 1dfcfe974395734fa467ce620661c7623d05ba83670de0529b1fbd63ff548b9d
  PATCH_SHA256: df3af583c06aa22748d21f039980cdd3923dbcab0bc21accbbb28b1cd1e7389
  OVERLAY_SHA256: 2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3

jobs:
  generate-build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build patcher CLI
        working-directory: code/patcher/java-cli
        run: |
          set -euo pipefail
          chmod +x build.sh run.sh
          ./build.sh

      - name: Prepare build-inputs
        env:
          PATCH_URL: ${{ inputs.patch_bundle_url }}
          PATCH_INPUT_SHA256: ${{ inputs.patch_bundle_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-inputs/external-resource-root release

          # Patch bundle priority:
          # 1. Explicit workflow URL
          # 2. resources/source-patch-bundle.zip
          # 3. Latest release asset named source-patch-bundle.zip
          if [[ -n "${PATCH_URL}" ]]; then
            echo "Downloading authorized patch bundle from workflow input..."
            curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --proto '=https' --tlsv1.2 "${PATCH_URL}" \
              -o build-inputs/source-patch-bundle.zip
            EXPECTED_PATCH_SHA256="${PATCH_INPUT_SHA256}"
          elif [[ -s resources/source-patch-bundle.zip ]]; then
            echo "Using repository patch bundle."
            cp resources/source-patch-bundle.zip build-inputs/source-patch-bundle.zip
            EXPECTED_PATCH_SHA256="${PATCH_SHA256}"
          else
            echo "Repository copy not present; looking for a release asset..."
            gh release download --pattern 'source-patch-bundle.zip' --clobber --dir build-inputs || true
            if [[ ! -s build-inputs/source-patch-bundle.zip ]]; then
              echo "::error::No source-patch-bundle.zip was found."
              echo "::error::Add the authorized bundle to resources/source-patch-bundle.zip or attach it to a GitHub release."
              exit 1
            fi
            EXPECTED_PATCH_SHA256="${PATCH_SHA256}"
          fi

          if [[ -z "${EXPECTED_PATCH_SHA256}" ]]; then
            echo "::error::A patch bundle SHA-256 is required."
            exit 1
          fi

          ACTUAL_PATCH_SHA256="$(sha256sum build-inputs/source-patch-bundle.zip | cut -d' ' -f1)"
          [[ "${ACTUAL_PATCH_SHA256}" == "${EXPECTED_PATCH_SHA256}" ]] || {
            echo "::error::Patch bundle SHA-256 mismatch."
            echo "Expected: ${EXPECTED_PATCH_SHA256}"
            echo "Actual:   ${ACTUAL_PATCH_SHA256}"
            exit 1
          }
          echo "PATCH_BUNDLE_SHA256=${ACTUAL_PATCH_SHA256}" >> "${GITHUB_ENV}"

          # The remaining Eagler build inputs are intentionally accepted either
          # from the repository or from the build-inputs directory. This keeps
          # the workflow usable without requiring GitHub's web editor to store
          # binary files in the repository.
          for name in resource-overlay-normal.zip sounds.epk music.epk; do
            if [[ -s "resources/${name}" ]]; then
              cp "resources/${name}" "build-inputs/${name}"
            elif [[ -s "build-inputs/${name}" ]]; then
              true
            else
              echo "::error::Missing build input: resources/${name}"
              exit 1
            fi
          done

          cp build-inputs/source-patch-bundle.zip build-inputs/source-patch-bundle.checked.zip

          echo "SOUNDS_SHA256=$(sha256sum build-inputs/sounds.epk | cut -d' ' -f1)" >> "${GITHUB_ENV}"
          echo "MUSIC_SHA256=$(sha256sum build-inputs/music.epk | cut -d' ' -f1)" >> "${GITHUB_ENV}"
          echo "OVERLAY_SHA256=$(sha256sum build-inputs/resource-overlay-normal.zip | cut -d' ' -f1)" >> "${GITHUB_ENV}"

      - name: Download Minecraft 26.2 client directly from Mojang
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            "https://piston-data.mojang.com/v1/objects/${MC_SHA1}/client.jar" \
            -o build-inputs/minecraft-26.2-client.jar
          test -s build-inputs/minecraft-26.2-client.jar

      - name: Use pinned Vineflower 1.12.0
        run: |
          set -euo pipefail
          cp resource/vineflower-1.12.0.jar build-inputs/vineflower-1.12.0.jar
          test -s build-inputs/vineflower-1.12.0.jar

      - name: Generate project skeleton
        run: |
          set -euo pipefail
          python3 code/patcher/project-skeleton/export_skeleton.py \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/build-inputs/project-skeleton-iwa.zip"

      - name: Verify all pinned inputs
        run: |
          set -euo pipefail
          test "$(sha256sum build-inputs/minecraft-26.2-client.jar | cut -d' ' -f1)" = "${MC_SHA256}"
          test "$(sha1sum build-inputs/minecraft-26.2-client.jar | cut -d' ' -f1)" = "${MC_SHA1}"
          test "$(sha256sum build-inputs/vineflower-1.12.0.jar | cut -d' ' -f1)" = "${VINEFLOWER_SHA256}"
          test "$(sha256sum build-inputs/source-patch-bundle.zip | cut -d' ' -f1)" = "${PATCH_BUNDLE_SHA256}"

      - name: Generate complete 26.2 project
        run: |
          set -euo pipefail
          code/patcher/java-cli/run.sh build-standalone \
            --jar "$GITHUB_WORKSPACE/build-inputs/minecraft-26.2-client.jar" \
            --output "$GITHUB_WORKSPACE/project" \
            --vineflower "$GITHUB_WORKSPACE/build-inputs/vineflower-1.12.0.jar" \
            --java17 "${JAVA_HOME_17_X64}/bin/java" \
            --patch-bundle "$GITHUB_WORKSPACE/build-inputs/source-patch-bundle.zip" \
            --expected-bundle-sha256 "${PATCH_BUNDLE_SHA256}" \
            --project-skeleton "$GITHUB_WORKSPACE/build-inputs/project-skeleton-iwa.zip" \
            --expected-skeleton-sha256 e76f606630ce6596061e7ac5a76d01a541846cac7d8d1424ec38a942ab00c071 \
            --resource-overlay "$GITHUB_WORKSPACE/build-inputs/resource-overlay-normal.zip" \
            --expected-resource-overlay-sha256 "${OVERLAY_SHA256}" \
            --external-resource-root "$GITHUB_WORKSPACE/build-inputs/external-resource-root" \
            --java25 "${JAVA_HOME_25_X64}/bin/java" \
            --node "$(command -v node)" \
            --npm "$(command -v npm)" \
            --sounds-epk "$GITHUB_WORKSPACE/build-inputs/sounds.epk" \
            --expected-sounds-epk-sha256 "${SOUNDS_SHA256}" \
            --music-epk "$GITHUB_WORKSPACE/build-inputs/music.epk" \
            --expected-music-epk-sha256 "${MUSIC_SHA256}" \
            --standalone-output "$GITHUB_WORKSPACE/release/bootstrap.html" \
            --music-pack-output "$GITHUB_WORKSPACE/release/eaglercraft-26.2-music-resource-pack.zip" \
            --build-timeout-seconds 7200

      - name: Install VBV companion assets
        run: |
          set -euo pipefail
          rm -rf /tmp/vbv-pack
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/melonman106/ChatGPT.git /tmp/vbv-pack
          git -C /tmp/vbv-pack sparse-checkout set \
            resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion
          pack=/tmp/vbv-pack/resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion
          test -d "${pack}/assets"
          cp -a "${pack}/assets/." project/game/src/main/resources/

      - name: Apply native VBV integration
        run: |
          set -euo pipefail
          chmod +x ModdedClient/apply-vbv.sh
          ModdedClient/apply-vbv.sh project

      - name: Compile patched source
        working-directory: project
        run: |
          set -euo pipefail
          ./gradlew :game:compileJava --console=plain --no-daemon

      - name: Build final VBV HTML
        run: |
          set -euo pipefail
          rm -f release/eaglercraft-26.2-vbv.html
          code/patcher/java-cli/run.sh build-standalone \
            --jar "$GITHUB_WORKSPACE/build-inputs/minecraft-26.2-client.jar" \
            --output "$GITHUB_WORKSPACE/project" \
            --vineflower "$GITHUB_WORKSPACE/build-inputs/vineflower-1.12.0.jar" \
            --java17 "${JAVA_HOME_17_X64}/bin/java" \
            --patch-bundle "$GITHUB_WORKSPACE/build-inputs/source-patch-bundle.zip" \
            --expected-bundle-sha256 "${PATCH_BUNDLE_SHA256}" \
            --project-skeleton "$GITHUB_WORKSPACE/build-inputs/project-skeleton-iwa.zip" \
            --expected-skeleton-sha256 e76f606630ce6596061e7ac5a76d01a541846cac7d8d1424ec38a942ab00c071 \
            --resource-overlay "$GITHUB_WORKSPACE/build-inputs/resource-overlay-normal.zip" \
            --expected-resource-overlay-sha256 "${OVERLAY_SHA256}" \
            --external-resource-root "$GITHUB_WORKSPACE/build-inputs/external-resource-root" \
            --java25 "${JAVA_HOME_25_X64}/bin/java" \
            --node "$(command -v node)" \
            --npm "$(command -v npm)" \
            --sounds-epk "$GITHUB_WORKSPACE/build-inputs/sounds.epk" \
            --expected-sounds-epk-sha256 "${SOUNDS_SHA256}" \
            --music-epk "$GITHUB_WORKSPACE/build-inputs/music.epk" \
            --expected-music-epk-sha256 "${MUSIC_SHA256}" \
            --standalone-output "$GITHUB_WORKSPACE/release/eaglercraft-26.2-vbv.html" \
            --music-pack-output "$GITHUB_WORKSPACE/release/eaglercraft-26.2-music-resource-pack.zip" \
            --reuse-project \
            --build-timeout-seconds 7200
          test -s release/eaglercraft-26.2-vbv.html

      - name: Archive generated project
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-generated-project-vbv
          path: project/
          retention-days: 7
          if-no-files-found: error

      - name: Archive HTML release
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-vbv-release
          path: release/
          retention-days: 30
          if-no-files-found: error

      - name: Publish release files
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/bootstrap.html
          git add release
          if git diff --cached --quiet; then
            echo "No release changes."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Build Eagler 26.2 ViaBackportVisuals client'
            git push
          fi
