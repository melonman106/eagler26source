name: Generate Eagler 26.2 + ViaBackportVisuals

on:
  workflow_dispatch:
    inputs:
      client_release_tag:
        description: "Private GitHub Release tag containing minecraft-26.2-client.jar"
        required: true
        default: "eagler-build-inputs"
        type: string

permissions:
  contents: write

concurrency:
  group: eagler-vbv-build
  cancel-in-progress: true

jobs:
  generate-build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show tool versions
        run: |
          set -euo pipefail
          java -version
          "${JAVA_HOME_17_X64}/bin/java" -version
          "${JAVA_HOME_25_X64}/bin/java" -version
          node --version
          npm --version
          gh --version

      - name: Build patcher CLI
        working-directory: code/patcher/java-cli
        run: |
          set -euo pipefail
          chmod +x build.sh run.sh
          ./build.sh

      - name: Check repository build inputs
        run: |
          set -euo pipefail
          required=(
            resources/source-patch-bundle.zip
            resources/project-skeleton-iwa.zip
            resources/resource-overlay-normal.zip
            resources/sounds.epk
            resources/music.epk
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing required authorized build input: $file"
              exit 1
            fi
          done

      - name: Download Minecraft 26.2 client from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.client_release_tag }}
        run: |
          set -euo pipefail
          mkdir -p build-inputs
          gh release download "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --pattern "minecraft-26.2-client.jar"             --dir build-inputs             --clobber
          test -s build-inputs/minecraft-26.2-client.jar

      - name: Download pinned Vineflower 1.12.0
        run: |
          set -euo pipefail
          mkdir -p build-inputs
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors             --proto '=https' --tlsv1.2             "https://github.com/Vineflower/vineflower/releases/download/1.12.0/vineflower-1.12.0.jar"             -o build-inputs/vineflower-1.12.0.jar
          test -s build-inputs/vineflower-1.12.0.jar

      - name: Verify pinned inputs
        run: |
          set -euo pipefail
          test "$(sha256sum build-inputs/minecraft-26.2-client.jar | cut -d' ' -f1)" =             40896ee9f1e2bec3c934daac7e93d41e9e3d9c2f8ae0ca366d52ffbfd1afa290
          test "$(sha256sum build-inputs/vineflower-1.12.0.jar | cut -d' ' -f1)" =             1dfcfe974395734fa467ce620661c7623d05ba83670de0529b1fbd63ff548b9d
          test "$(sha256sum resources/source-patch-bundle.zip | cut -d' ' -f1)" =             df3af583c06aa22748d21f039980cdd3923dbcab0bc21accbbb28b1cd1e7389
          test "$(sha256sum resources/project-skeleton-iwa.zip | cut -d' ' -f1)" =             e76f606630ce6596061e7ac5a76d01a541846cac7d8d1424ec38a942ab00c071
          test "$(sha256sum resources/resource-overlay-normal.zip | cut -d' ' -f1)" =             2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3

          echo "SOUNDS_SHA256=$(sha256sum resources/sounds.epk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "MUSIC_SHA256=$(sha256sum resources/music.epk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Prepare build inputs
        run: |
          set -euo pipefail
          rm -rf build-inputs/external-resource-root project release
          mkdir -p build-inputs/external-resource-root release
          cp resources/source-patch-bundle.zip build-inputs/source-patch-bundle.zip
          cp resources/project-skeleton-iwa.zip build-inputs/project-skeleton-iwa.zip
          cp resources/resource-overlay-normal.zip build-inputs/resource-overlay-normal.zip
          cp resources/sounds.epk build-inputs/sounds.epk
          cp resources/music.epk build-inputs/music.epk

      - name: Generate complete 26.2 project
        run: |
          set -euo pipefail
          code/patcher/java-cli/run.sh build-standalone             --jar "$GITHUB_WORKSPACE/build-inputs/minecraft-26.2-client.jar"             --output "$GITHUB_WORKSPACE/project"             --vineflower "$GITHUB_WORKSPACE/build-inputs/vineflower-1.12.0.jar"             --java17 "${JAVA_HOME_17_X64}/bin/java"             --patch-bundle "$GITHUB_WORKSPACE/build-inputs/source-patch-bundle.zip"             --expected-bundle-sha256 df3af583c06aa22748d21f039980cdd3923dbcab0bc21accbbb28b1cd1e7389             --project-skeleton "$GITHUB_WORKSPACE/build-inputs/project-skeleton-iwa.zip"             --expected-skeleton-sha256 e76f606630ce6596061e7ac5a76d01a541846cac7d8d1424ec38a942ab00c071             --resource-overlay "$GITHUB_WORKSPACE/build-inputs/resource-overlay-normal.zip"             --expected-resource-overlay-sha256 2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3             --external-resource-root "$GITHUB_WORKSPACE/build-inputs/external-resource-root"             --java25 "${JAVA_HOME_25_X64}/bin/java"             --node "$(command -v node)"             --npm "$(command -v npm)"             --sounds-epk "$GITHUB_WORKSPACE/build-inputs/sounds.epk"             --expected-sounds-epk-sha256 "$SOUNDS_SHA256"             --music-epk "$GITHUB_WORKSPACE/build-inputs/music.epk"             --expected-music-epk-sha256 "$MUSIC_SHA256"             --standalone-output "$GITHUB_WORKSPACE/release/bootstrap.html"             --music-pack-output "$GITHUB_WORKSPACE/release/eaglercraft-26.2-music-resource-pack.zip"             --build-timeout-seconds 7200

      - name: Record generated source fingerprint
        run: |
          set -euo pipefail
          find project/game/src/main/java -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/java-before-vbv.sha256
          sha256sum /tmp/java-before-vbv.sha256

      - name: Fetch VBV companion resource assets
        run: |
          set -euo pipefail
          rm -rf /tmp/vbv-pack
          git clone --depth 1 --filter=blob:none --sparse             https://github.com/melonman106/ChatGPT.git /tmp/vbv-pack
          git -C /tmp/vbv-pack sparse-checkout set             resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion
          pack=/tmp/vbv-pack/resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion
          test -d "$pack/assets"
          cp -a "$pack/assets/." project/game/src/main/resources/
          echo "VBV resource assets installed."

      - name: Apply native VBV client integration
        run: |
          set -euo pipefail
          chmod +x ModdedClient/apply-vbv.sh
          ModdedClient/apply-vbv.sh project

      - name: Verify native VBV source changes
        run: |
          set -euo pipefail
          find project/game/src/main/java -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/java-after-vbv.sha256

          if cmp -s /tmp/java-before-vbv.sha256 /tmp/java-after-vbv.sha256; then
            echo "::error::VBV integration made no Java source changes."
            echo "::error::The workflow will not publish a client that only has the resource-pack assets."
            echo "::error::Implement the native 26.2 networking/rendering patch in ModdedClient/apply-vbv.sh before publishing."
            exit 1
          fi

          if ! grep -R -E -i "viabackportvisuals|VbvMarkerPayload|visualId|marker"             project/game/src/main/java project/viabackportvisuals >/dev/null 2>&1; then
            echo "::error::No VBV protocol/native integration symbols were found after patching."
            exit 1
          fi

          echo "Native VBV source changes detected."

      - name: Compile patched source
        working-directory: project
        run: |
          set -euo pipefail
          ./gradlew :game:compileJava --console=plain --no-daemon

      - name: Build final patched HTML
        run: |
          set -euo pipefail
          rm -f release/eaglercraft-26.2-vbv.html
          code/patcher/java-cli/run.sh build-standalone             --jar "$GITHUB_WORKSPACE/build-inputs/minecraft-26.2-client.jar"             --output "$GITHUB_WORKSPACE/project"             --vineflower "$GITHUB_WORKSPACE/build-inputs/vineflower-1.12.0.jar"             --java17 "${JAVA_HOME_17_X64}/bin/java"             --patch-bundle "$GITHUB_WORKSPACE/build-inputs/source-patch-bundle.zip"             --expected-bundle-sha256 df3af583c06aa22748d21f039980cdd3923dbcab0bc21accbbb28b1cd1e7389             --project-skeleton "$GITHUB_WORKSPACE/build-inputs/project-skeleton-iwa.zip"             --expected-skeleton-sha256 e76f606630ce6596061e7ac5a76d01a541846cac7d8d1424ec38a942ab00c071             --resource-overlay "$GITHUB_WORKSPACE/build-inputs/resource-overlay-normal.zip"             --expected-resource-overlay-sha256 2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3             --external-resource-root "$GITHUB_WORKSPACE/build-inputs/external-resource-root"             --java25 "${JAVA_HOME_25_X64}/bin/java"             --node "$(command -v node)"             --npm "$(command -v npm)"             --sounds-epk "$GITHUB_WORKSPACE/build-inputs/sounds.epk"             --expected-sounds-epk-sha256 "$SOUNDS_SHA256"             --music-epk "$GITHUB_WORKSPACE/build-inputs/music.epk"             --expected-music-epk-sha256 "$MUSIC_SHA256"             --standalone-output "$GITHUB_WORKSPACE/release/eaglercraft-26.2-vbv.html"             --music-pack-output "$GITHUB_WORKSPACE/release/eaglercraft-26.2-music-resource-pack.zip"             --reuse-project             --build-timeout-seconds 7200
          test -s release/eaglercraft-26.2-vbv.html

      - name: Run project self-tests
        working-directory: project
        run: |
          set -euo pipefail
          test -f build.gradle.kts
          test -d game/src/main/java
          test -d game/src/main/resources
          grep -R -E -i "viabackportvisuals|VbvMarkerPayload|visualId|marker"             game/src/main/java viabackportvisuals

      - name: Archive generated source project
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-generated-project-vbv
          path: project/
          retention-days: 7
          if-no-files-found: error

      - name: Archive HTML release
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-vbv-release
          path: release/
          retention-days: 30
          if-no-files-found: error

      - name: Publish release files to repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/bootstrap.html
          git add release
          if git diff --cached --quiet; then
            echo "No release changes."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Build Eagler 26.2 ViaBackportVisuals client'
            git push
          fi
