name: Test source-patches folder

on:
  workflow_dispatch:
  push:
    paths:
      - "code/patcher/source-patches/**"
      - "eag26.3-assets.epk"
      - ".github/workflows/test-source-patches.yml"

permissions:
  contents: read

jobs:
  test-source-folder:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show source-patches folder
        run: |
          set -euo pipefail
          echo "=== source-patches tree ==="
          find code/patcher/source-patches -maxdepth 2 -type f -print | sort
          echo
          echo "=== source-patches README ==="
          cat code/patcher/source-patches/README.md

      - name: Run source-patches tests
        run: |
          set -euo pipefail
          python3 code/patcher/source-patches/test_export_source_patches.py

      - name: Build patcher CLI
        working-directory: code/patcher/java-cli
        run: |
          set -euo pipefail
          chmod +x build.sh run.sh
          ./build.sh

      - name: Inspect 26.3 EPK input
        run: |
          set -euo pipefail
          test -s eag26.3-assets.epk
          echo "EPK size:"
          stat -c '%s bytes' eag26.3-assets.epk
          echo "EPK SHA-256:"
          sha256sum eag26.3-assets.epk

      - name: Download Eagler Binary Tools
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors             --proto '=https' --tlsv1.2             "https://raw.githubusercontent.com/lax1dude/eagler-binary-tools/main/EaglerBinaryTools.jar"             -o EaglerBinaryTools.jar
          test -s EaglerBinaryTools.jar

      - name: Extract 26.3 EPK
        run: |
          set -euo pipefail
          rm -rf extracted-26.3
          java -jar EaglerBinaryTools.jar epkdecompiler eag26.3-assets.epk extracted-26.3
          test -d extracted-26.3
          echo "Extracted file count:"
          find extracted-26.3 -type f | wc -l
          echo
          echo "=== 26.3 VBV assets found ==="
          find extracted-26.3 -type f \
            \( -iname '*wool*stairs*' -o -iname '*wool*slab*' \
            -o -iname '*concrete*stairs*' -o -iname '*concrete*slab*' \
            -o -iname '*straw*bed*' -o -iname '*hay_block*' \) \
            | sort | head -300

      - name: Upload test extraction
        uses: actions/upload-artifact@v4
        with:
          name: source-patches-and-26.3-assets-test
          path: |
            extracted-26.3/
            code/patcher/source-patches/
          retention-days: 7
          if-no-files-found: error
